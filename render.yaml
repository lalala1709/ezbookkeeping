services:
  - type: web
    name: fbtmoney
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz.json
    envVars:
      - key: EBK_GLOBAL_MODE
        value: production
      - key: EBK_SERVER_HTTP_ADDR
        value: 0.0.0.0
      - key: EBK_SERVER_HTTP_PORT
        value: "10000"
      - key: EBK_SERVER_ROOT_URL
        fromService:
          type: web
          name: fbtmoney
          envVarKey: RENDER_EXTERNAL_URL
      - key: EBK_DATABASE_TYPE
        value: postgres
      - key: EBK_DATABASE_URL
        fromDatabase:
          name: ezbookkeeping-db
          property: connectionString
      - key: EBK_LOG_MODE
        value: console
      - key: EBK_SECURITY_SECRET_KEY
        generateValue: true
      # Free Render web services have no persistent disk. Disable uploads so
      # avatars and receipt pictures are not silently lost after a redeploy.
      - key: EBK_USER_ENABLE_CUSTOM_ICON
        value: "false"
      - key: EBK_USER_ENABLE_TRANSACTION_PICTURE
        value: "false"
      - key: EBK_USER_AVATAR_PROVIDER
        value: gravatar

databases:
  - name: ezbookkeeping-db
    plan: free
    region: singapore
    databaseName: ezbookkeeping
    user: ezbookkeeping
